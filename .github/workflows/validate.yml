name: Validate static site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check JavaScript syntax
        run: |
          node --check script.js
          node --check course-data.js
          node --check course-progress.js
          node --check course-enhancements.js
          node --check lesson.js
          node --check resource-data.js
          node --check library.js
          node --check resource.js
          node --check assessment-data.js
          node --check assessment-progress.js
          node --check assessment.js
          node --check academic.js
          node --check certificate.js
          node --check settings.js
          node --check cloud-config.js
          node --check cloud-client.js
          node --check cloud-sync.js
          node --check account.js
          node --check sw.js

      - name: Validate static references
        run: node scripts/validate.mjs

      - name: Validate course architecture
        run: node scripts/validate-course.mjs

      - name: Validate library architecture
        run: node scripts/validate-library.mjs

      - name: Validate academic architecture
        run: node scripts/validate-academic.mjs

      - name: Validate local data and offline architecture
        run: node scripts/validate-local-data.mjs

      - name: Validate cloud account architecture
        run: node scripts/validate-cloud.mjs
