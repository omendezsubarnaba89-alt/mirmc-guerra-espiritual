name: Validate V11 Content

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-content:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate V11 architecture
        run: node scripts/validate-content.mjs
      - name: Check browser JavaScript syntax
        run: |
          node --check content-runtime.js
          node --check admin-content.js
          node --check admin-content-restore.js
          node --check admin-content-audit.js
          node --check admin-preview.js
          node --check admin-versions.js
          node --check course-enhancements.js
          node --check library.js
          node --check resource.js
          node --check lesson.js
          node --check study.js
