name: Validate V13 Analytics

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-analytics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate analytics privacy
        run: node scripts/validate-analytics.mjs
      - name: Check browser syntax
        run: node --check admin-analytics.js
