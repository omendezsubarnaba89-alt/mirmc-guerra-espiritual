name: Validate Official Recovery

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-official-recovery:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate one-way recovery
        run: node scripts/validate-official-recovery.mjs
      - name: Check syntax
        run: node --check official-recovery.js
